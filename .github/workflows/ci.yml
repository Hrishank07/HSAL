name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Tests run against mock backends - no Ollama/Chroma/Redis needed
      - run: pip install pytest pytest-cov pydantic pydantic-settings python-dotenv prometheus-client
      - run: pytest --cov=hsal --cov-report=term-missing
      - name: Coverage summary
        if: matrix.python-version == '3.12'
        run: |
          pytest --cov=hsal --cov-report= --quiet
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  benchmark-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pydantic pydantic-settings python-dotenv prometheus-client
      - run: python benchmarks/run_benchmark.py --requests 1000 --pool 100
