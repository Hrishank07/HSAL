name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # CVE-2026-45829 ("ChromaToast"): pre-auth RCE in ChromaDB's FastAPI
      # *server mode* via malicious embedding-function config. No fixed
      # release exists yet. HSAL is not exposed: it uses the embedded
      # PersistentClient (no Chroma server/port) and never uses Chroma's
      # embedding functions (embeddings are computed externally and passed
      # as raw vectors). Remove this ignore once a patched version ships —
      # Dependabot + the weekly schedule will surface it.
      - run: pip-audit -r requirements.txt --ignore-vuln CVE-2026-45829

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
