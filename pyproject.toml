[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hsal"
version = "0.2.0"
description = "Hybrid Semantic Acceleration Layer - two-tier (exact + semantic) response cache for LLM pipelines"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Hrishank Chhatbar", email = "hrishankc@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
# Install only the backends you use
api = ["fastapi>=0.110", "uvicorn>=0.27"]
ollama = ["ollama>=0.1.0"]
openai = ["openai>=1.0.0"]
redis = ["redis>=5.0.0"]
chroma = ["chromadb>=0.4.0"]
all = ["hsal[api,ollama,openai,redis,chroma]"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "hsal[all]"]

[project.urls]
Repository = "https://github.com/Hrishank07/HSAL"

[tool.setuptools.packages.find]
include = ["hsal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv", ".venv", "chroma_db"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter conventions
]
